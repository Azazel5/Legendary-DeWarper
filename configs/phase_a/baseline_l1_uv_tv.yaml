# Phase A baseline: masked L1 dewarp + UV L1 + TV on flow (no SSIM as loss)

phase: phase_a
loss_slug: baseline_l1_uv_tv

data_dir: renders/synthetic_data_pitch_sweep
train_split: 0.8
batch_size: 4
num_workers: 4
img_size: [518, 518]   # Dinov2 patch 14: divisible size; HF processor aligns

model_id: facebook/dinov2-large
freeze_backbone_epochs: 0   # 0 = train full model from epoch 0

epochs: 100
lr: 1.0e-4
weight_decay: 0.01
optimizer: adamw
grad_clip_norm: 1.0

# Save epoch_* checkpoints every N epochs (set to 50 to reduce disk usage)
checkpoint_every: 50

# Loss weights (UVReconstructionLoss with loss_type l1)
reconstruction_weight: 1.0
uv_weight: 0.5
smoothness_weight: 0.01

amp: true
amp_dtype: bfloat16   # float16 on older GPUs without bf16

seed: 42

eval_every_epoch: true
primary_metric: val_ssim_masked   # for best.pt selection
