# Phase C: Phase B baseline with VGG perceptual loss and optional refinement head

phase: phase_c
loss_slug: baseline_l1_uv_tv_perceptual

data_dir: renders/synthetic_data_pitch_sweep
train_split: 0.8
batch_size: 4
num_workers: 4
img_size: [518, 518]

model_id: facebook/dinov2-large
freeze_backbone_epochs: 0

decoder_channels: [128, 192, 256]
flow_scale: 0.35

epochs: 100
lr: 1.0e-4
weight_decay: 0.01
optimizer: adamw
grad_clip_norm: 1.0

# Loss weights (UVReconstructionLoss with loss_type l1)
reconstruction_weight: 1.0
uv_weight: 0.5
smoothness_weight: 0.01
perceptual_weight: 0.1

# Optional refinement head (small CNN)
use_refinement_head: false
refinement_channels: [64, 32]

amp: true
amp_dtype: bfloat16

seed: 42

eval_every_epoch: true
primary_metric: val_ssim_masked

checkpoint_every: 50
